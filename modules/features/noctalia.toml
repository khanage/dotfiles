[backdrop]
enabled = true

[bar.default]
center = [ "control-center", "cpu", "ram", "network" ]
end = [ "tray", "notifications", "clipboard", "bluetooth", "volume", "brightness", "battery", "session" ]
position = "bottom"
start = [ "launcher", "workspaces", "clock", "media" ]

[location]
address = "Melbourne, Australia"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1920.0
    cy = 1418.0
    output = "DP-1"
    placement_height = 1600.0
    placement_width = 3840.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[theme]
builtin = "Nord"

[wallpaper.default]
path = "/home/khan/Pictures/Wallpapers/ign_astronaut.png"

[wallpaper.last]
path = "/home/khan/Pictures/Wallpapers/ign_astronaut.png"

[wallpaper.monitors.DP-1]
path = "/home/khan/Pictures/Wallpapers/ign_astronaut.png"
